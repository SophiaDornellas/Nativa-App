<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Coletor - Nativa App</title>
    <link rel="stylesheet" href="../CSS/Cadastro_coletor.css">
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> -->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css">
</head>
<body>

    <header class="css-header">
        <a href="../HTML/Pagina_inicial.html" class="css-brand">
            <i class="fa-solid fa-leaf"></i>
            <span>Nativa App</span>
        </a>
        <a href="../HTML/Login.html" class="css-login-btn">
            <i class="fa-solid fa-right-to-bracket"></i> Login
        </a>
    </header>

    <main class="css-main-container">
        
        <div class="css-avatar-square">
            <i class="fa-solid fa-truck-field"></i>
        </div>
        
        <h1 class="css-page-title">Cadastre-se como coletor</h1>

        <div class="css-register-card">
            <form action="#" id="form_cadastro_coletor"  autocomplete="off">
                
                <div class="css-form-group">
                    <label class="css-form-label">Nome Completo</label>
                    <input type="text" id="input_nome_coletor" class="css-form-input" placeholder="Digite seu nome" required>
                </div>

                <div class="css-form-group">
                    <label class="css-form-label">E-mail</label>
                    <input type="email" id="input_email_coletor" class="css-form-input" placeholder="exemplo@email.com" required autocomplete="off">
                </div>

                <div class="css-form-group">
                    <label class="css-form-label">Telefone / WhatsApp</label>
                    <input type="tel" id="input_telefone_coletor" class="css-form-input" placeholder="(00) 00000-0000" required>
                </div>

                <div class="css-form-group">
                    <label class="css-form-label">Senha</label>
                    <input type="password" id="input_senha_coletor" class="css-form-input" placeholder="Crie uma senha segura" required autocomplete="off">
                </div>

                <button type="submit" class="css-submit-btn">Cadastrar</button>
                
                <div class="css-extra-links">
                    <p>Já possui uma conta? <a href="../HTML/Login.html" class="css-link-item">Faça login</a></p>
                </div>
            </form>
        </div>

    </main>

    <footer class="css-footer">
        <p>&copy; 2026 Nativa App. Todos os direitos reservados.</p>
    </footer>
    <script type="module" src="../JS/Cadastro_coletor.js"></script>
</body>
</html>
