    <style>
        /* 1. Ajusta o container pai para separar o "Voltar" (esquerda) da "Engrenagem" (direita) */
        .css-header-back {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* 2. Atualização da classe .css-top-nav */
        .css-top-nav {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--color-primary);
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

<body>

    <header class="css-user-header">
        <div class="css-header-back">
            <a href="#" id="btnVoltarSair"><i class="fa-solid fa-arrow-left Sair"></i> Voltar</a>

            <a href="#" class="css-top-nav" id="btnEngrenagem" style="font-size: 1.15rem;">
                <i class="fa-solid fa-gear"></i>
            </a>
        </div>
        <div class="css-profile-card">
            <div class="css-profile-info">
                <div class="css-profile-avatar">
                    <i class="fa-solid fa-truck"></i>
                </div>
                <div>
                    <h2 id="nomeColetorHeader">Carlos</h2>
                    <p>Coletor Parceiro</p>
                </div>
            </div>
            <div class="css-bonus-box">
                <span><i class="fa-solid fa-wallet"></i> Bônus Acumulado</span>
                <strong>R$ 120,00</strong>
            </div>
        </div>
    </header>

    <main class="css-main-content">

        <details class="css-collapsible-section" open>
            <summary class="css-section-title">
                Pedidos Disponíveis na Rede
                <i class="fa-solid fa-chevron-down css-arrow-icon"></i>
            </summary>

            <div class="css-collapsible-body">
                <form class="css-filter-grid" onsubmit="return false;">
                    <div class="css-filter-item">
                        <select class="css-select-input" id="tipoResiduoFiltro">
                            <option value=""> Todos tipos de resíduos</option>
                            <option value="seco">Resíduo seco Misturado</option>
                            <option value="papelao">Papelão</option>
                            <option value="plastico">Plástico</option>
                        </select>
                    </div>
                    <div class="css-filter-item">
                        <select class="css-select-input" id="volumeFiltro">
                            <option value=""> Todos volumes</option>
                            <option value="pouco">Pouco</option>
                            <option value="medio">Médio</option>
                            <option value="muito">Muito</option>
                        </select>
                    </div>
                    <div class="css-filter-item">
                        <input type="date" class="css-select-input" id="dataFiltro" placeholder="Todas datas">
                    </div>
                    <div class="css-filter-item">
                        <select class="css-select-input" id="regiaoFiltro">
                            <option value=""> Todas Regiões</option>
                            <option value="barreiro">Barreiro</option>
                            <option value="centro-sul">Centro-Sul</option>
                            <option value="leste">Leste</option>
                            <option value="pampulha">Pampulha</option>
                            <option value="venda-nova">Venda Nova</option>
                            <option value="nordeste">Nordeste</option>
                            <option value="noroeste">Noroeste</option>
                            <option value="norte">Norte</option>
                            <option value="oeste">Oeste</option>
                        </select>
                    </div>
                </form>

            </div>
        </details>

            <summary class="css-section-title">
                <h2 class="css-section-static-title">Minha Agenda de Trabalho</h2>

            <section class="css-static-section">

    </main>

    <!-- =========================================================================
         MODAL DE EDIÇÃO DE PERFIL (FLUTUANTE)
         ========================================================================= -->
    <div class="css-modal-overlay" id="modalEditarPerfil">
        <div class="css-modal-card">
            <!-- Botão de Fechar (X) -->
            <button class="css-modal-close" id="btnFecharModal">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <h3 class="css-modal-title">
                <i class="fa-solid fa-user-pen"></i> Editar Perfil
            </h3>

            <form id="formEditarPerfil" onsubmit="return false;">
                <div class="css-modal-field">
                    <label for="editNome">Nome:</label>
                    <input type="text" id="editNome" class="css-modal-input" placeholder="Digite seu nome">
                </div>

                <div class="css-modal-field">
                    <label for="editTelefone">Telefone:</label>
                    <input type="tel" id="editTelefone" class="css-modal-input" placeholder="(31) 99999-9999">
                </div>

                <button type="submit" class="css-btn-action css-btn-green" style="margin-top: 10px;">
                    Salvar Alterações
                </button>
            </form>
        </div>
    </div>

    <!-- =========================================================================
     MODAL DE CONFIRMAÇÃO DE SAIR (FLUTUANTE)
     ========================================================================= -->
  <div class="css-modal-overlay" id="modalConfirmarSair">
    <div class="css-modal-card gen-modal-logout-card">
        <button class="css-modal-close" id="btnFecharModalSair">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <h3 class="css-modal-title" style="justify-content: center; color: var(--color-red);">
            <i class="fa-solid fa-right-from-bracket"></i> Sair da Conta
        </h3>

        <p class="gen-modal-logout-text">
            Tem certeza de que deseja encerrar sua sessão no aplicativo?
        </p>

        <button type="button" id="btnConfirmarLogout" class="css-btn-logout-danger">
            <i class="fa-solid fa-power-off"></i> Sair
        </button>
    </div>
