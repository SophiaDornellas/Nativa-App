<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nativa App - Login</title>
    <link rel="stylesheet" href="../CSS/Login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
</head>
<body>

    <header class="css-header">
        <a href="Pagina_inicial.html" class="css-brand">
            <i class="fa-solid fa-leaf css-brand-icon"></i>
            <span>Nativa App</span>
        </a>
        <a href="Pagina_inicial.html" class="css-register-nav-btn">
            <i class="fa-solid fa-user-plus"></i>
            <span>Cadastrar</span>
        </a>
    </header>

    <main class="css-main-container">
        <div class="css-avatar-square">
            <i class="fa-solid fa-lock"></i>
        </div>

        <h1 class="css-page-title">Entre no Nativa App</h1>

        <div class="css-login-card">
            <form id="form_login">
                <div class="css-form-group">
                    <label class="css-form-label">E-mail *</label>
                    <input 
                        type="email" 
                        id="input_login_email"
                        class="css-form-input" 
                        placeholder="seu@email.com" 
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="css-form-group">
                    <label class="css-form-label">Senha *</label>
                    <input 
                        type="password" 
                        id = "input_login_senha"
                        class="css-form-input" 
                        placeholder="Sua senha" 
                        required
                        autocomplete="current-password"
                    >
                </div>

               

                <button type="submit" class="css-submit-btn" id="bot_logar">
                    <span>Entrar</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>

                
            </form>
       <div class="css-utility-row">
                    <!-- <label class="css-checkbox-label">
                        <input type="checkbox" class="css-checkbox-input">
                        <span>Lembrar de mim</span>
                    </label> -->

                    <details>
                     <summary>
                          <a href="#" class="css-forgot-link">Esqueci minha senha</a>
                     </summary>
                     <div class="css-reset-box">
                         <p class="css-reset-text">
                           Não se preocupe! Digite seu e-mail abaixo e enviaremos um link para você redefinir sua senha.
                        </p>
                       <div class="css-reset-input-group">
                        
                            <form id="form_esqueciSenha">
                                <input type="email" id="input_reset_email" name="email"  placeholder="Digite seu e-mail cadastrado" required />
                                <button type="submit"  id="bot_esqueciSenha" class="css-reset-btn">Enviar e-mail</button>
                            </form>
                       
                            
                       </div>
                    </div>
                    </details>
                    
        </div>

        <div class="css-extra-links">
                    <span>Ainda não tem conta? </span>
                    <a href="Pagina_inicial.html" class="css-link-item">Cadastre-se aqui</a>
                </div>

        </div>
    </main>

    <footer class="css-footer">
        <p>&copy; 2026 Nativa App. Todos os direitos reservados.</p>
    </footer>
    
    <script type="module" src="../JS/Login.js"></script>

</body>
</html>
