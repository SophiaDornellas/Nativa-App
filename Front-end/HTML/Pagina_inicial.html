<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nativa App</title>
    <link rel="stylesheet" href="../CSS/Pagina_inicial.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
</head>
<body>

    <header class="css-header">
        <div class="css-brand">
            <i class="fa-solid fa-leaf"></i>
            <span>Nativa App</span>
        </div>
        <a href="#" class="css-login-btn">
            <i class="fa-solid fa-right-to-bracket"></i> Login
        </a>
    </header>

    <main class="css-main-container">
        <div class="css-welcome-icon">
            <i class="fa-solid fa-leaf"></i>
        </div>
        
        <h1 class="css-hero-title">Bem-vindo ao Nativa App</h1>
        <p class="css-hero-subtitle">Escolha como você quer participar da mudança do fluxo de coleta.</p>

        <div class="css-options-grid">
            
            <a href="#" class="css-card-option">
                <div class="css-icon-container">
                    <i class="fa-solid fa-hand-holding-heart"></i>
                </div>
                <h2 class="css-card-title">Gerador</h2>
                <p class="css-card-desc">Quero descartar meus resíduos recicláveis de forma prática.</p>
            </a>

            <a href="#" class="css-card-option">
                <div class="css-icon-container">
                    <i class="fa-solid fa-truck"></i>
                </div>
                <h2 class="css-card-title">Coletor</h2>
                <p class="css-card-desc">Quero encontrar coletas disponíveis na minha região.</p>
            </a>

        </div>
    </main>

    <footer class="css-footer">
        <p>&copy; 2026 Nativa App. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
